name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: docker build -t thedirectory:test .
      - name: Smoke test container
        run: |
          docker run -d --name directory-test -p 4321:4321 thedirectory:test
          for i in $(seq 1 20); do
            if curl --fail http://localhost:4321/api/health; then exit 0; fi
            sleep 2
          done
          docker logs directory-test
          exit 1
