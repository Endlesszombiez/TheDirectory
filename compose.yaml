services:
  directory:
    image: ghcr.io/endlesszombiez/thedirectory:latest
    container_name: thedirectory
    restart: unless-stopped
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - directory-data:/app/data
    environment:
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4321}
      DOCKER_API_URL: ${DOCKER_API_URL:-}
      PORTAINER_HOME_URL: ${PORTAINER_HOME_URL:-}
      DOCKHAND_HOME_URL: ${DOCKHAND_HOME_URL:-}
      # Optional Docker discovery: add a socket mount or DOCKER_API_URL in an override.
      # See README for restricted proxy, socket permissions, and Swarm setup.
volumes:
  directory-data:
