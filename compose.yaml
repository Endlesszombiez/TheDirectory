services:
  directory:
    image: ghcr.io/endlesszombiez/thedirectory:latest
    container_name: thedirectory
    restart: unless-stopped
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - directory-data:/app/data
    environment:
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4321}
      DOCKER_API_URL: ${DOCKER_API_URL-http://docker-proxy:2375}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-}
      PORTAINER_HOME_URL: ${PORTAINER_HOME_URL:-}
      DOCKHAND_HOME_URL: ${DOCKHAND_HOME_URL:-}
    depends_on:
      - docker-proxy
    networks:
      - default
      - docker-api
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: '1'
      SERVICES: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
networks:
  docker-api:
    internal: true
volumes:
  directory-data:
